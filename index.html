  <!-- Apply saved theme before first paint to avoid flash -->

  <style>
    html {
      scroll-behavior: smooth;
      scroll-padding-top: 5.5rem;
    }

    body {
      font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
    }

    ::selection {
      background: rgba(16, 185, 129, 0.45);
      color: #fff;
    }

    /* Slim custom scrollbar */
    ::-webkit-scrollbar {
      width: 10px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(100, 116, 139, 0.35);
      border-radius: 8px;
    }

    .dark ::-webkit-scrollbar-thumb {
      background: rgba(16, 185, 129, 0.35);
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(16, 185, 129, 0.6);
    }

    /* Animated line grid backdrop: fine cells + bolder major lines, drifting diagonally */
    .bg-grid {
      background-image:
        linear-gradient(to right, rgba(5, 150, 105, 0.10) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(5, 150, 105, 0.10) 1px, transparent 1px),
        linear-gradient(to right, rgba(5, 150, 105, 0.05) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(5, 150, 105, 0.05) 1px, transparent 1px);
      background-size: 224px 224px, 224px 224px, 56px 56px, 56px 56px;
      animation: grid-pan 60s linear infinite;
      -webkit-mask-image: radial-gradient(ellipse 100% 85% at 50% 0%, black 30%, transparent 98%);
      mask-image: radial-gradient(ellipse 100% 85% at 50% 0%, black 30%, transparent 98%);
    }

    .dark .bg-grid {
      background-image:
        linear-gradient(to right, rgba(52, 211, 153, 0.09) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(52, 211, 153, 0.09) 1px, transparent 1px),
        linear-gradient(to right, rgba(52, 211, 153, 0.045) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(52, 211, 153, 0.045) 1px, transparent 1px);
    }

    @keyframes grid-pan {
      from { background-position: 0 0; }
      to { background-position: 224px 224px; }
    }

    /* Infinite marquee */
    @keyframes marquee {
      from { transform: translateX(0); }
      to { transform: translateX(-50%); }
    }

    @keyframes marquee-reverse {
      from { transform: translateX(-50%); }
      to { transform: translateX(0); }
    }

    .animate-marquee {
      animation: marquee 40s linear infinite;
    }

    .animate-marquee-reverse {
      animation: marquee-reverse 46s linear infinite;
    }

    .marquee-row:hover .animate-marquee,
    .marquee-row:hover .animate-marquee-reverse {
      animation-play-state: paused;
    }

    .marquee-mask {
      -webkit-mask-image: linear-gradient(to right, transparent, black 12%, black 88%, transparent);
      mask-image: linear-gradient(to right, transparent, black 12%, black 88%, transparent);
    }

    /* Blinking terminal cursor */
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    .animate-blink {
      animation: blink 1s step-end infinite;
    }

    /* Slow conic spin for the avatar ring */
    @keyframes spin-slow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .animate-spin-slow {
      animation: spin-slow 8s linear infinite;
    }

    /* Gentle float for decorative chips */
    @keyframes float-y {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .animate-float {
      animation: float-y 5s ease-in-out infinite;
    }

    /* Button shine sweep */
    @keyframes shine {
      from { transform: translateX(-150%) skewX(-20deg); }
      to { transform: translateX(250%) skewX(-20deg); }
    }

    .btn-shine::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 40%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.35), transparent);
      transform: translateX(-150%) skewX(-20deg);
    }

    .btn-shine:hover::after {
      animation: shine 0.9s ease;
    }

    /* Spotlight cards: radial glow tracks the cursor via --mx / --my */
    .spotlight-card {
      position: relative;
    }

    .spotlight-card::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      opacity: 0;
      transition: opacity 0.4s ease;
      background: radial-gradient(480px circle at var(--mx, 50%) var(--my, 50%), rgba(16, 185, 129, 0.14), transparent 45%);
      pointer-events: none;
    }

    .spotlight-card:hover::before {
      opacity: 1;
    }

    /* Flow connector: data packet traveling down the line between sections */
    @keyframes packet-flow {
      0% { top: -30%; opacity: 0; }
      12% { opacity: 1; }
      80% { opacity: 1; }
      100% { top: 105%; opacity: 0; }
    }

    .animate-packet {
      animation: packet-flow 2.6s ease-in infinite;
    }

    /* Slow drift for gradient text */
    @keyframes gradient-x {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    .animate-gradient-x {
      background-size: 200% auto;
      animation: gradient-x 6s ease-in-out infinite;
    }

    /* Pulsing ring on flow nodes */
    @keyframes pulse-node {
      0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.5); }
      70%, 100% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
    }

    .animate-pulse-node {
      animation: pulse-node 2.4s ease-out infinite;
    }

    @media (prefers-reduced-motion: reduce) {

      .animate-marquee,
      .animate-marquee-reverse,
      .animate-spin-slow,
      .animate-float,
      .animate-packet,
      .animate-gradient-x,
      .animate-pulse-node,
      .bg-grid {
        animation: none;
      }

      html {
        scroll-behavior: auto;
      }
    }
  </style>
</head>
