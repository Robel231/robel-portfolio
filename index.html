<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#020d0a">

  <!-- Icons -->
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">

  <!-- Per-page SEO: title, description, canonical, hreflang, social cards and JSON-LD, from seo.ts -->
  <!--app-head-->

  <!-- Apply saved theme before first paint to avoid flash -->
  <script>
    try {
      if ((localStorage.getItem('theme') || 'dark') === 'dark') {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    } catch (e) { document.documentElement.classList.add('dark'); }
  </script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&display=swap"
    rel="stylesheet">

  <!-- Without JavaScript, show the prerendered content that would otherwise wait to animate in -->
  <noscript>
    <style>#root [style^="opacity:0"] { opacity: 1 !important; transform: none !important; }</style>
  </noscript>

</head>

<body class="bg-slate-50 dark:bg-[#020d0a]">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
